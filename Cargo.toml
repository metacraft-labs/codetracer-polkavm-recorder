[package]
name = "codetracer-polkavm-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for PolkaVM programs (RISC-V based virtual machine)"
license = "Apache-2.0"

[[bin]]
name = "codetracer-polkavm-recorder"
path = "src/main.rs"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# PolkaVM
polkavm = "0.32"
polkavm-common = "0.32"
polkavm-linker = "0.32"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Hashing (ink! selector computation)
blake2 = "0.10"

[dev-dependencies]
codetracer_trace_reader = { path = "../codetracer-trace-format/codetracer_trace_reader" }
tempfile = "3"

# polkavm-linker 0.32.0 with one fix (vendor/polkavm-linker/src/dwarf.rs,
# `extract_lines`): each line-table row is filed at its own address. Upstream
# files every row of a function at the function's first instruction when the
# line program advances by special opcodes, so a blob linked from a Rust guest
# carried no file, line or column for any instruction. Drop this once a
# polkavm-linker release carries the fix.
[patch.crates-io]
polkavm-linker = { path = "vendor/polkavm-linker" }
