name: CI

# Re-plays the project's deterministic dev env on the runner.
# See:
#   https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-shared-dev-env.md

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

env:
  POLKAVM_BACKEND: interpreter
  POLKAVM_ALLOW_EXPERIMENTAL: "1"

jobs:
  lint-and-test:
    name: Lint and test (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner: [[self-hosted, linux, x64], [self-hosted, linux, arm64], [self-hosted, macos, arm64]]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) at the
        # workspace-lock-pinned revisions before materialising the nix env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Build Nim trace writer library (sibling artifact)
        # TODO: replace with `direnv exec ../codetracer-trace-format-nim
        # just build-trace-writer-lib` once the sibling repo ships
        # that target -- per cross-repo-builds.md.
        run: |
          dev-exec bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
            nimble install -y stew results
            nim c --app:staticlib --mm:arc --noMain -d:release -p:src \
              -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
          '
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"

      - name: Lint
        run: dev-exec just lint

      - name: Allow unprivileged user namespaces
        # PolkaVM's Linux sandbox needs unprivileged user
        # namespaces to spawn its sandboxed worker process.
        # Ubuntu noble (24.04) restricts these by default via
        # apparmor; the test then fails with:
        #   failed to create a sandboxed worker process; run
        #   'sysctl -w kernel.apparmor_restrict_unprivileged_userns=0'
        run: |
          set -euo pipefail
          sysctl_key=/proc/sys/kernel/apparmor_restrict_unprivileged_userns

          if [ ! -e "$sysctl_key" ]; then
            echo "AppArmor unprivileged-userns restriction is not present on this runner."
            exit 0
          fi

          if [ "$(cat "$sysctl_key")" = "0" ]; then
            echo "Unprivileged user namespaces are already allowed."
            exit 0
          fi

          if [ -w "$sysctl_key" ]; then
            echo 0 > "$sysctl_key"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "Skipping AppArmor unprivileged-userns relaxation; runner does not allow sudo."
          fi

      - name: Test
        run: dev-exec just test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ join(matrix.runner, '-') }}
          path: target/
          retention-days: 1

      - name: Mirror test logs to S3 (non-blocking)
        if: failure()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: target/
          prefix: test-logs-${{ join(matrix.runner, '-') }}/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
