name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone codetracer-trace-format (Cargo path dependency)
        run: |
          PINS=".github/sibling-pins"
          TF_REF="main"
          if [ -f "${PINS}" ]; then
            PIN="$(grep '^codetracer-trace-format ' "${PINS}" | cut -d' ' -f2)" || true
            [ -n "${PIN}" ] && TF_REF="${PIN}"
          fi
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
          if ! git clone --depth 1 --branch "${TF_REF}" --single-branch \
            "https://github.com/metacraft-labs/codetracer-trace-format.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format" 2>/dev/null; then
            rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" \
              "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git -C "${GITHUB_WORKSPACE}/../codetracer-trace-format" checkout "${TF_REF}"
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Relax AppArmor user-namespace restriction
        # PolkaVM's Linux sandbox needs unprivileged user namespaces,
        # which ubuntu-latest restricts via AppArmor by default.
        # This is best-effort; the POLKAVM_SANDBOXING_ENABLED=false
        # fallback below guarantees tests still pass if this fails.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: cargo build --all-targets
        env:
          POLKAVM_SANDBOXING_ENABLED: "false"
          POLKAVM_ALLOW_EXPERIMENTAL: "1"

      - name: Run tests with zero-test guard
        env:
          POLKAVM_SANDBOXING_ENABLED: "false"
          POLKAVM_ALLOW_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUTPUT=$(cargo test --all-targets 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          # Guard against silently empty test suites
          if ! echo "$OUTPUT" | grep -qP "test result: ok\. [1-9]"; then
            echo "::error::Zero tests passed — check that test binaries are compiling correctly"
            exit 1
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/
          retention-days: 7
